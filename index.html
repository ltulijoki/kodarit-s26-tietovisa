<!DOCTYPE html>
<html lang="fi">
    <head>
        <meta charset="utf-8">
        <title>Tietovisa</title>
        <link rel="icon" href="robotti.png">
        <link rel="stylesheet" href="styles.css">
        <script src="game.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Tietovisa</h1>
            <p>Kerää kaikki kuusi aihealuetta</p>
        </header>
        <section class="game-area">
            <article class="player-card">
                <h2>Pelaaja</h2>
                <img class="player-image" src="pelaaja.png">
                <p>Kerätyt aihealueet 0/6</p>
                <div class="category-collection">
                    <span class="category-chip" data-category="maantieto">Maantieto</span>
                    <span class="category-chip" data-category="yleistieto">Yleistieto</span>
                    <span class="category-chip collected" data-category="historia">Historia</span>
                    <span class="category-chip" data-category="taide ja kulttuuri">Taide ja kulttuuri</span>
                    <span class="category-chip" data-category="tiede">Tiede ja luonto</span>
                    <span class="category-chip collected" data-category="urheilu">Urheilu</span>
                </div>
                <section class="question-panel">
                    <h2>Aihealue</h2>
                    <h2>Kysymys</h2>
                    <div class="answers">
                        <button class="answer-button">Vastausvaihtoehto 1</button>
                        <button class="answer-button">Vastausvaihtoehto 2</button>
                        <button class="answer-button">Vastausvaihtoehto 3</button>
                        <button class="answer-button">Vastausvaihtoehto 4</button>
                    </div>
                </section>
            </article>
            <section class="turn-panel">
                <p>Vuorossa</p>
                <h2>Pelaaja</h2>
                <div id="dice" class="dice">-</div>
                <div id="board" class="board">
                    <div class="space" data-category="historia">Historia</div>
                </div>
            </section>
            <article class="player-card">
                <h2>Tekoäly</h2>
                <img class="player-image" src="robotti.png">
                <p>Kerätyt aihealueet 0/6</p>
            </article>
        </section>
    </body>
</html>
