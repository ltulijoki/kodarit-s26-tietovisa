<!DOCTYPE html>
<html lang="fi">
    <head>
        <meta charset="utf-8">
        <title>Tietovisa</title>
        <link rel="icon" href="robotti.png">
        <link rel="stylesheet" href="styles.css">
        <script src="game.js" defer></script>
    </head>
    <body>
        <header>
            <h1>Tietovisa</h1>
            <p>Kerää kaikki kuusi aihealuetta</p>
        </header>
        <section class="game-area">
            <article class="player-card">
                <h2>Pelaaja</h2>
                <img class="player-image" src="pelaaja.png">
                <p>Kerätyt aihealueet 0/6</p>
            </article>
            <section class="turn-panel">
                <p>Vuorossa</p>
                <h2>Pelaaja</h2>
                <div class="dice">-</div>
                <div id="board" class="board">
                    <div class="space" data-category="historia">Historia</div>
                </div>
            </section>
            <article class="player-card">
                <h2>Tekoäly</h2>
                <img class="player-image" src="robotti.png">
                <p>Kerätyt aihealueet 0/6</p>
            </article>
        </section>
    </body>
</html>
